<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glow.ai | المساعد التعليمي الذكي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07080c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Glow-Ai">
    <link rel="apple-touch-icon" href="192.png">

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-dark: #07080c;
            --bg-surface: rgba(18, 21, 31, 0.78);
            --bg-elevated: rgba(25, 30, 44, 0.9);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.35);
            --gold: #d4af37;
            --gold-bright: #f3d06b;
            --emerald: #10b981;
            --grad-lux: linear-gradient(135deg, #f3d06b 0%, #d4af37 50%, #10b981 100%);
            --grad-gold: linear-gradient(135deg, #f3d06b 0%, #b88a1e 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% -10%, rgba(212, 175, 55, 0.13), transparent 48%),
                radial-gradient(circle at 85% 90%, rgba(16, 185, 129, 0.07), transparent 45%);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.25); border-radius: 99px; }

        header {
            padding: 12px 5%;
            background: rgba(7, 8, 12, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .menu-btn {
            width: 38px; height: 38px;
            border-radius: 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .menu-btn:hover {
            border-color: var(--border-gold);
            color: var(--gold-bright);
        }

        .top-logo {
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .top-logo .shine {
            background: var(--grad-lux);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-tag {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--gold-bright);
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 2px 8px;
            border-radius: 99px;
        }

        .admin-active-pill {
            display: none;
            background: rgba(212, 175, 55, 0.14);
            border: 1px solid var(--border-gold);
            color: var(--gold-bright);
            padding: 6px 13px;
            border-radius: 99px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            align-items: center;
            gap: 6px;
        }
        .admin-active-pill:hover {
            background: rgba(239, 68, 68, 0.14);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        #sidebar-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 90;
            display: none;
        }
        #sidebar-overlay.active { display: block; }

        #sidebar {
            position: fixed;
            right: -310px;
            top: 0;
            width: 285px;
            height: 100%;
            background: #0b0d14;
            border-left: 1px solid var(--border-subtle);
            z-index: 100;
            transition: 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 18px;
            box-shadow: -12px 0 35px rgba(0, 0, 0, 0.65);
        }
        #sidebar.open { right: 0; }

        .sidebar-head {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 14px; margin-bottom: 14px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .sidebar-head h3 {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--gold-bright);
            display: flex; align-items: center; gap: 7px;
        }

        .side-btn {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: 0.2s;
        }
        .side-new {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-gold);
            color: var(--gold-bright);
        }
        .side-new:hover { background: rgba(212, 175, 55, 0.18); }

        .side-moe {
            background: var(--grad-gold);
            border: none;
            color: #07080c;
            font-weight: 700;
        }

        .history-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 6px;
        }
        .history-header-row span {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 600;
        }
        .clear-history-link {
            background: none;
            border: none;
            color: #f87171;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .clear-history-link:hover { background: rgba(239, 68, 68, 0.12); }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 2px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid transparent;
            padding: 10px 12px;
            border-radius: 11px;
            font-size: 0.82rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .history-item:hover, .history-item.active-chat {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.28);
            color: var(--text-main);
        }
        .history-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .del-single-chat {
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 3px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .del-single-chat:hover { color: #f87171; background: rgba(239, 68, 68, 0.15); }

        .sidebar-footer-admin {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
        }
        .side-admin-last {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: var(--gold-bright);
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .side-admin-last:hover {
            background: rgba(212, 175, 55, 0.14);
            border-color: var(--gold-bright);
        }

        #chat-box {
            flex: 1;
            padding: 18px 5%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .brand-hero {
            margin: auto;
            max-width: 540px;
            width: 100%;
            text-align: center;
            padding: 14px 0;
            animation: fadeIn 0.35s ease;
        }

        .hero-emblem {
            width: 68px; height: 68px;
            margin: 0 auto 14px;
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.18), rgba(16, 185, 129, 0.08));
            border: 1px solid var(--border-gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            color: var(--gold-bright);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.18), inset 0 0 18px rgba(212, 175, 55, 0.08);
        }

        .hero-brand-title {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            background: var(--grad-lux);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .hero-sub {
            color: var(--text-muted);
            font-size: 0.86rem;
            margin-bottom: 20px;
        }

        .lux-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .lux-card {
            background: var(--bg-surface);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px 14px;
            text-align: right;
            cursor: pointer;
            transition: 0.22s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .lux-card:hover {
            border-color: var(--border-gold);
            background: rgba(212, 175, 55, 0.06);
            transform: translateY(-2px);
        }
        .lux-card i { color: var(--gold-bright); font-size: 0.95rem; margin-bottom: 2px; }
        .lux-card span { font-size: 0.82rem; font-weight: 600; color: var(--text-main); }
        .lux-card small { font-size: 0.72rem; color: var(--text-dim); }

        .msg-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 90%;
            animation: slideUp 0.22s ease;
        }
        .ai-wrapper { align-self: flex-start; width: 100%; max-width: 780px; }
        .user-wrapper { align-self: flex-end; flex-direction: row-reverse; }

        .ai-avatar {
            width: 34px; height: 34px;
            border-radius: 11px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid var(--border-gold);
            color: var(--gold-bright);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 0.92rem;
        }

        .msg-col { flex: 1; min-width: 0; }

        .msg {
            line-height: 1.7;
            font-size: 0.9rem;
            padding: 13px 16px;
            border-radius: 16px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .msg.ai {
            background: var(--bg-surface);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-top-right-radius: 4px;
            color: var(--text-main);
        }

        .msg.user {
            background: var(--grad-gold);
            color: #07080c;
            font-weight: 700;
            border-top-left-radius: 4px;
            padding: 9px 15px;
        }

        .msg.ai p { margin-bottom: 10px; }
        .msg.ai p:last-child { margin-bottom: 0; }
        .msg.ai ul, .msg.ai ol { padding-right: 20px; margin-bottom: 10px; }
        .msg.ai li { margin-bottom: 5px; }
        .msg.ai strong { color: var(--gold-bright); font-weight: 700; }
        .msg.ai h1, .msg.ai h2, .msg.ai h3 { color: #fff; margin: 12px 0 6px; font-weight: 700; font-size: 0.98rem; }
        .msg.ai pre {
            background: #050609;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px;
            overflow-x: auto;
            margin: 10px 0;
            direction: ltr;
            text-align: left;
            font-family: monospace;
            font-size: 0.82rem;
            color: var(--gold-bright);
        }
        .msg.ai code {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold-bright);
            padding: 1px 5px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.85em;
        }
        .msg.ai pre code { background: transparent; padding: 0; color: inherit; }

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 20px;
            padding: 0 2px;
        }
        .typing-dots span {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--gold-bright);
            display: inline-block;
            animation: pulseDot 1.3s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.18s; background: var(--emerald); }
        .typing-dots span:nth-child(3) { animation-delay: 0.36s; }

        @keyframes pulseDot {
            0%, 80%, 100% { transform: scale(0.55) translateY(0); opacity: 0.35; }
            40% { transform: scale(1.15) translateY(-4px); opacity: 1; }
        }

        .msg-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 7px;
        }
        .action-chip-btn {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 5px 11px;
            border-radius: 8px;
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .action-chip-btn:hover, .action-chip-btn.speaking {
            color: var(--gold-bright);
            border-color: var(--border-gold);
            background: rgba(212, 175, 55, 0.12);
        }

        .source-chip {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: var(--gold-bright);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            text-decoration: none;
            margin-top: 6px;
            margin-left: 5px;
        }
        .source-chip img { width: 14px; height: 14px; border-radius: 3px; }

        .dock-area {
            padding: 8px 5% 18px;
            background: linear-gradient(to top, var(--bg-dark) 75%, transparent);
            z-index: 15;
        }

        .dock-toolbar {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }

        .web-pill {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 4px 13px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .web-pill.active {
            border-color: var(--border-gold);
            color: var(--gold-bright);
            background: rgba(212, 175, 55, 0.12);
        }

        .composer {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-elevated);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 22px;
            padding: 8px 10px;
            display: flex;
            align-items: flex-end;
            gap: 6px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            transition: border-color 0.25s;
        }
        .composer:focus-within { border-color: var(--border-gold); }

        .composer textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.9rem;
            padding: 6px 4px;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            line-height: 1.45;
        }
        .composer textarea::placeholder { color: var(--text-dim); font-size: 0.85rem; }

        .tool-btn {
            width: 34px; height: 34px;
            border-radius: 11px;
            color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            flex-shrink: 0;
            background: transparent;
            border: none;
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--gold-bright); }
        .tool-btn.mic-active {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.14);
            animation: pulseMic 1.2s infinite;
        }

        @keyframes pulseMic {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .submit-btn {
            width: 36px; height: 36px;
            border-radius: 12px;
            border: none;
            background: var(--grad-gold);
            color: #07080c;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 0.92rem;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .submit-btn:hover { transform: scale(1.04); }
        .submit-btn.stop-mode { background: #ef4444 !important; color: #fff !important; }

        .modal-backdrop {
            display: none;
            position: fixed; inset: 0;
            background: rgba(3, 4, 8, 0.82);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: #0e111a;
            border: 1px solid var(--border-gold);
            border-radius: 22px;
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .modal-card h3 { font-size: 1.05rem; font-weight: 700; color: var(--gold-bright); margin-bottom: 6px; }
        .modal-card p { font-size: 0.84rem; color: var(--text-muted); line-height: 1.5; }
        .modal-card input {
            width: 100%;
            background: #07080c;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            margin: 14px 0;
            text-align: center;
            font-size: 0.95rem;
            outline: none;
        }
        .modal-card input:focus { border-color: var(--gold-bright); }

        .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-gold {
            flex: 1;
            background: var(--grad-gold);
            color: #07080c;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.86rem;
            cursor: pointer;
        }
        .btn-dark {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.86rem;
            cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 560px) {
            .lux-grid { grid-template-columns: 1fr; }
            .msg-wrapper { max-width: 95%; }
            #chat-box { padding: 14px 4%; }
        }
    </style>
</head>
<body>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
    <div class="sidebar-head">
        <h3><i class="fas fa-graduation-cap"></i> سجل Glow</h3>
        <div class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></div>
    </div>

    <button class="side-btn side-new" onclick="startNewChat(); toggleSidebar();"><i class="fas fa-plus"></i> محادثة جديدة</button>
    <a href="https://www.moe.edu.ps/gaza/subjects" target="_blank" class="side-btn side-moe"><i class="fas fa-book-open"></i> تحميل الرزم التعليمية</a>

    <div class="history-header-row">
        <span>الدردشات المحفوظة</span>
        <button class="clear-history-link" onclick="clearAllHistory()"><i class="fas fa-trash-can"></i> مسح الكل</button>
    </div>

    <div class="history-list" id="history-list"></div>

    <div class="sidebar-footer-admin">
        <button class="side-admin-last" onclick="toggleSidebar(); openAdminModal();">
            <i class="fas fa-user-shield"></i>
            <span>وضع الأدمن</span>
        </button>
    </div>
</div>

<header>
    <div class="header-left">
        <div class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        <div class="top-logo" onclick="startNewChat()">
            <i class="fas fa-graduation-cap" style="color:var(--gold-bright);"></i>
            <span class="shine">Glow.ai</span>
            <span class="top-tag">LUXURY</span>
        </div>
    </div>
    <div id="adminActiveTag" class="admin-active-pill" onclick="logoutAdmin()">
        <i class="fas fa-shield-check"></i>
        <span>ADMIN ● خروج</span>
    </div>
</header>

<div id="chat-box"></div>

<div class="dock-area">
    <div class="dock-toolbar">
        <div class="web-pill" id="webSearchBtn" onclick="toggleWebSearch()">
            <i class="fas fa-globe"></i>
            <span>بحث الويب</span>
        </div>
    </div>

    <div id="preview-container" style="display:none; text-align:center; margin-bottom:8px;">
        <div style="display:inline-block; position:relative;">
            <img id="preview-img" src="" style="height:58px; border-radius:12px; border:1.5px solid var(--gold-bright);">
            <i class="fas fa-times-circle" onclick="cancelImage()" style="position:absolute; top:-6px; right:-6px; color:#ef4444; background:#fff; border-radius:50%; cursor:pointer;"></i>
        </div>
    </div>

    <div id="pdf-info" style="text-align:center; color:var(--gold-bright); font-size:0.76rem; font-weight:600; display:none; margin-bottom:6px;"></div>

    <div class="composer">
        <label for="file-input" class="tool-btn" title="ملف PDF"><i class="fas fa-file-pdf"></i></label>
        <input type="file" id="file-input" accept="application/pdf" style="display:none" onchange="processPDF(this)">

        <label for="image-input" class="tool-btn" title="صورة"><i class="fas fa-image"></i></label>
        <input type="file" id="image-input" accept="image/*" style="display:none" onchange="previewImage(this)">

        <button type="button" id="micBtn" class="tool-btn" title="شرح / سؤال بالصوت" onclick="toggleVoiceInput()"><i class="fas fa-microphone"></i></button>

        <textarea id="userInput" rows="1" placeholder="اسأل Glow أو اطلب شرحاً بالصوت..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>

        <button id="sendBtn" class="submit-btn" onclick="askAI()">
            <i id="sendIcon" class="fas fa-arrow-up"></i>
        </button>

</div>

<div id="limitModal" class="modal-backdrop">
    <div class="modal-card">
        <div style="font-size:2rem; color:var(--gold-bright); margin-bottom:8px;"><i class="fas fa-graduation-cap"></i></div>
        <h3>تم استهلاك المحاولات المتاحة</h3>
        <p>يمكنك تفعيل وضع الأدمن للمتابعة بدون قيود.</p>
        <div class="modal-actions">
            <button class="btn-gold" onclick="closeModal('limitModal'); openAdminModal();">دخول الأدمن</button>
            <button class="btn-dark" onclick="closeModal('limitModal')">إغلاق</button>
        </div>
    </div>
</div>

<div id="adminPanel" class="modal-backdrop">
    <div class="modal-card">
        <h3><i class="fas fa-user-shield"></i> تفعيل وضع الأدمن</h3>
        <p>أدخل كود المطور لتشغيل الصلاحيات الكاملة.</p>
        <input type="password" id="adminPass" placeholder="كود الأدمن" onkeydown="if(event.key==='Enter') verifyAdmin()">
        <div class="modal-actions">
            <button class="btn-gold" onclick="verifyAdmin()">تفعيل</button>
            <button class="btn-dark" onclick="closeModal('adminPanel')">إلغاء</button>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    marked.setOptions({
        breaks: true,
        gfm: true
    });

    const p1 = "sk-or-v1-";
    const p2 = "a38edadebdd2115f8aeaaa5e0b2bf0ca";
    const p3 = "a42887de22e33536ada71561950623d9";
    const API_KEY = p1 + p2 + p3;

    const STORAGE_CHATS_KEY = 'glow_saved_chats_v1';
    const STORAGE_ATTEMPTS_KEY = 'glow_hidden_attempts_10';

    let pdfText = "", chatHistory = [], selectedImageBase64 = null;
    let currentChatId = Date.now(), isWebSearch = false;
    let typingInterval = null, isTyping = false;
    let recognition = null, isListening = false;

    // متغيرات الصوت المزدوج (Native + Cloud Audio Fallback)
    let currentSpeakingBtn = null;
    let cloudAudioPlayer = null;
    let isAudioCancelled = false;

    let isAdmin = sessionStorage.getItem('Glow_admin_mode') === 'true';
    let remainingAttempts = parseInt(localStorage.getItem(STORAGE_ATTEMPTS_KEY), 10);
    if (isNaN(remainingAttempts)) {
        remainingAttempts = 10;
        localStorage.setItem(STORAGE_ATTEMPTS_KEY, 10);
    }

    window.onload = () => {
        applyAdminUI();
        renderBrandHero();
        loadHistoryList();
        initSpeechRecognition();
    };

    function applyAdminUI() {
        document.getElementById('adminActiveTag').style.display = isAdmin ? 'inline-flex' : 'none';
    }

    function openAdminModal() {
        document.getElementById('adminPass').value = '';
        document.getElementById('adminPanel').style.display = 'flex';
        setTimeout(() => document.getElementById('adminPass').focus(), 100);
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    function verifyAdmin() {
        if (document.getElementById('adminPass').value === "19791983") {
            sessionStorage.setItem('Glow_admin_mode', 'true');
            isAdmin = true;
            closeModal('adminPanel');
            applyAdminUI();
            if (chatHistory.length === 0) renderBrandHero();
        } else {
            alert("كود الأدمن غير صحيح!");
        }
    }

    function logoutAdmin() {
        sessionStorage.removeItem('Glow_admin_mode');
        isAdmin = false;
        applyAdminUI();
        if (chatHistory.length === 0) renderBrandHero();
    }

    function handleEnter(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            askAI();
        }
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    function toggleWebSearch() {
        isWebSearch = !isWebSearch;
        document.getElementById('webSearchBtn').classList.toggle('active');
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function renderBrandHero() {
        stopSpeech();
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = `
            <div class="brand-hero" id="brandHero">
                <div class="hero-emblem"><i class="fas fa-graduation-cap"></i></div>
                <div class="hero-brand-title">Glow.ai</div>
                <p class="hero-sub">${isAdmin ? "وضع الأدمن مفعل • مساحة مفتوحة" : "مساعدك التعليمي الفاخر لفهم الدروس والملفات"}</p>
                <div class="lux-grid">
                    <div class="lux-card" onclick="quickAsk('اشرح لي بالصوت وبأسلوب مبسط قاعدة دراسية مهمة مع أمثلة')">
                        <i class="fas fa-volume-up"></i>
                        <span>شرح مبسط مع صوت</span>
                        <small>توضيح واضح وقابل للاستماع</small>
                    </div>
                    <div class="lux-card" onclick="quickAsk('لخّص لي أهم النقاط في ملف الـ PDF المرفق بشكل واضح')">
                        <i class="fas fa-file-pdf"></i>
                        <span>تلخيص ملف PDF</span>
                        <small>استخراج الأفكار الأساسية</small>
                    </div>
                    <div class="lux-card" onclick="quickAsk('أنشئ لي اختباراً سريعاً من 5 أسئلة')">
                        <i class="fas fa-clipboard-check"></i>
                        <span>اختبار تدريبي</span>
                        <small>قياس مستوى الفهم</small>
                    </div>
                    <div class="lux-card" onclick="quickAsk('ساعدني في ترتيب جدول مراجعة يومي منظم')">
                        <i class="fas fa-calendar-alt"></i>
                        <span>تنظيم المراجعة</span>
                        <small>تقسيم الوقت بذكاء</small>
                    </div>
                </div>
            </div>
        `;
    }

    function startNewChat() {
        stopCurrentTyping();
        stopSpeech();
        currentChatId = Date.now();
        chatHistory = [];
        pdfText = "";
        cancelImage();
        document.getElementById('pdf-info').style.display = "none";
        renderBrandHero();
        loadHistoryList();
    }

    function quickAsk(text) {
        document.getElementById('userInput').value = text;
        askAI();
    }

    function initSpeechRecognition() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) return;
        recognition = new SpeechRec();
        recognition.lang = 'ar-SA';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            const input = document.getElementById('userInput');
            input.value = input.value ? (input.value + " " + transcript) : transcript;
            autoResize(input);
        };

        recognition.onend = () => {
            isListening = false;
            document.getElementById('micBtn').classList.remove('mic-active');
        };

        recognition.onerror = () => {
            isListening = false;
            document.getElementById('micBtn').classList.remove('mic-active');
        };
    }

    function toggleVoiceInput() {
        if (!recognition) {
            alert("المتصفح الحالي لا يدعم الإدخال الصوتي.");
            return;
        }
        if (isListening) {
            recognition.stop();
            isListening = false;
            document.getElementById('micBtn').classList.remove('mic-active');
        } else {
            stopSpeech();
            isListening = true;
            document.getElementById('micBtn').classList.add('mic-active');
            recognition.start();
        }
    }

    // ==========================================
    // نظام الصوت المزدوج (يعمل على كل الجوالات و WebView)
    // ==========================================
    function stopSpeech() {
        isAudioCancelled = true;
        if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        if (cloudAudioPlayer) {
            try {
                cloudAudioPlayer.pause();
                cloudAudioPlayer.src = "";
            } catch (e) {}
            cloudAudioPlayer = null;
        }
        if (currentSpeakingBtn) {
            currentSpeakingBtn.classList.remove('speaking');
            currentSpeakingBtn.innerHTML = '<i class="fas fa-volume-high"></i> استماع للشرح';
            currentSpeakingBtn = null;
        }
    }

    function cleanTextForSpeech(raw) {
        return raw
            .replace(/[*#_`~>•\-]/g, ' ')
            .replace(/https?:\/\/[^\s]+/g, '')
            .replace(/[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function splitIntoChunks(text, maxLen = 170) {
        const sentences = text.split(/(?<=[.!؟،\n])\s+/);
        const chunks = [];
        let current = "";
        for (const s of sentences) {
            if (!s.trim()) continue;
            if ((current + " " + s).trim().length <= maxLen) {
                current = (current + " " + s).trim();
            } else {
                if (current) chunks.push(current);
                if (s.length <= maxLen) {
                    current = s.trim();
                } else {
                    for (let i = 0; i < s.length; i += maxLen) {
                        chunks.push(s.slice(i, i + maxLen).trim());
                    }
                    current = "";
                }
            }
        }
        if (current) chunks.push(current);
        return chunks;
    }

    function speakMessage(btn) {
        if (currentSpeakingBtn === btn) {
            stopSpeech();
            return;
        }

        stopSpeech();
        isAudioCancelled = false;

        const msgCol = btn.closest('.msg-col');
        const rawText = msgCol.dataset.rawText || msgCol.querySelector('.msg.ai').innerText;
        const cleanText = cleanTextForSpeech(rawText);
        if (!cleanText) return;

        currentSpeakingBtn = btn;
        btn.classList.add('speaking');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التشغيل...';

        // محاولة التشغيل عبر الصوت السحابي المضمون للجوالات أولاً أو كبديل فوري
        playCloudChunks(cleanText, btn);
    }

    function playCloudChunks(fullText, btn) {
        const chunks = splitIntoChunks(fullText, 165);
        let index = 0;

        function playNext() {
            if (isAudioCancelled || index >= chunks.length) {
                if (!isAudioCancelled) stopSpeech();
                return;
            }

            const chunkText = chunks[index];
            const isArabic = /[\u0600-\u06FF]/.test(chunkText);
            const langCode = isArabic ? 'ar' : 'en';
            const ttsUrl = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${langCode}&q=${encodeURIComponent(chunkText)}`;

            cloudAudioPlayer = new Audio(ttsUrl);
            cloudAudioPlayer.onplaying = () => {
                if (!isAudioCancelled && btn) {
                    btn.innerHTML = '<i class="fas fa-stop"></i> إيقاف الصوت';
                }
            };
            cloudAudioPlayer.onended = () => {
                index++;
                playNext();
            };
            cloudAudioPlayer.onerror = () => {
                // في حال تعذر الإنترنت للصوت السحابي ننتقل للنطق الداخلي للجهاز
                fallbackNativeSpeech(fullText, btn);
            };

            cloudAudioPlayer.play().catch(() => {
                fallbackNativeSpeech(fullText, btn);
            });
        }

        playNext();
    }

    function fallbackNativeSpeech(text, btn) {
        if (!('speechSynthesis' in window) || isAudioCancelled) {
            stopSpeech();
            return;
        }
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = /[\u0600-\u06FF]/.test(text) ? 'ar-SA' : 'en-US';
            utterance.rate = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const arVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
            if (arVoice) utterance.voice = arVoice;

            utterance.onstart = () => {
                if (!isAudioCancelled && btn) {
                    btn.innerHTML = '<i class="fas fa-stop"></i> إيقاف الصوت';
                }
            };
            utterance.onend = () => stopSpeech();
            utterance.onerror = () => stopSpeech();

            window.speechSynthesis.speak(utterance);
        } catch (e) {
            stopSpeech();
        }
    }

    // ==========================================
    // نسخ النص المضمون 100% على كل الأجهزة والمتصفحات
    // ==========================================
    function copyText(btn) {
        const msgCol = btn.closest('.msg-col');
        const textToCopy = msgCol.dataset.rawText || msgCol.querySelector('.msg.ai').innerText;

        const finishCopyUI = () => {
            const origHtml = '<i class="far fa-copy"></i> نسخ';
            btn.innerHTML = '<i class="fas fa-check" style="color:var(--gold-bright);"></i> تم النسخ';
            setTimeout(() => {
                btn.innerHTML = origHtml;
            }, 1800);
        };

        // الطريقة 1: execCommand المضمونة في WebView و content:// و HTTP
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        textArea.setAttribute("readonly", "");
        textArea.style.position = "fixed";
        textArea.style.top = "-9999px";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        textArea.setSelectionRange(0, textArea.value.length);

        let copied = false;
        try {
            copied = document.execCommand('copy');
        } catch (err) {
            copied = false;
        }
        document.body.removeChild(textArea);

        if (copied) {
            finishCopyUI();
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy)
                .then(() => finishCopyUI())
                .catch(() => alert("تعذر النسخ التلقائي، حدد النص يدوياً."));
        }
    }

    function sanitizeLanguage(text) {
        if (!text) return "";
        return text.replace(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g, "").trim();
    }

    function previewImage(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedImageBase64 = e.target.result.split(',')[1];
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('preview-container').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function cancelImage() {
        selectedImageBase64 = null;
        const imgInput = document.getElementById('image-input');
        if (imgInput) imgInput.value = '';
        document.getElementById('preview-container').style.display = 'none';
    }

    async function processPDF(input) {
        const file = input.files[0]; if (!file) return;
        const info = document.getElementById('pdf-info');
        info.style.display = "block";
        info.innerText = "جاري قراءة الملف... ⏳";
        const reader = new FileReader();
        reader.onload = async function() {
            try {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += `[صفحة ${i}]: ` + content.items.map(s => s.str).join(" ") + "\n";
                    info.innerText = `جاري التحميل: ${i} / ${pdf.numPages}`;
                }
                pdfText = fullText;
                info.innerText = `تم حفظ ${pdf.numPages} صفحة ✅`;
                saveCurrentChatToStorage();
            } catch (err) {
                info.innerText = "تعذر قراءة الملف ❌";
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function setStopState(active) {
        isTyping = active;
        const btn = document.getElementById('sendBtn');
        const icon = document.getElementById('sendIcon');
        if (active) {
            btn.classList.add('stop-mode');
            icon.className = 'fas fa-stop';
        } else {
            btn.classList.remove('stop-mode');
            icon.className = 'fas fa-arrow-up';
        }
    }

    function stopCurrentTyping() {
        if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
        setStopState(false);
    }

    async function askAI() {
        if (isTyping) { stopCurrentTyping(); return; }
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text && !selectedImageBase64) return;

        if (!isAdmin && remainingAttempts <= 0) {
            document.getElementById('limitModal').style.display = 'flex';
            return;
        }

        stopSpeech();

        const hero = document.getElementById('brandHero');
        if (hero) hero.remove();

        const imgForDisplay = selectedImageBase64;
        addMessage(text || "تحليل صورة...", "user", false, imgForDisplay);

        const currentContent = selectedImageBase64 ? [
            { type: "text", text: text || "ماذا يوجد في هذه الصورة؟" },
            { type: "image_url", image_url: { url: `data:image/jpeg;base64,${selectedImageBase64}` } }
        ] : text;

        chatHistory.push({
            role: "user",
            content: currentContent,
            displayText: text || "تحليل صورة...",
            imgPreview: imgForDisplay || null
        });

        cancelImage();
        input.value = "";
        input.style.height = 'auto';

        const chatBox = document.getElementById('chat-box');
        const typing = document.createElement('div');
        typing.className = 'msg-wrapper ai-wrapper';
        typing.innerHTML = `
            <div class="ai-avatar"><i class="fas fa-graduation-cap"></i></div>
            <div class="msg-col">
                <div class="msg ai">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                </div>
            </div>`;
        chatBox.appendChild(typing);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            let sysPrompt = "أنت Glow التعليمي، مساعد ذكي للطلاب. تطوير م. أحمد الأسطل. يجب أن تكتب إجاباتك باللغة العربية الواضحة والمفهومة فقط (أو الإنجليزية إذا طلب المستخدم ذلك صراحةً). يُمنع منعاً باتاً استخدام أي لغة صينية أو كورية أو يابانية. نسّق الشرح بشكل مرتب وواضح ليصلح أيضاً للقراءة الصوتية. لا تذكر جوجل نهائياً.";
            if (pdfText) sysPrompt += "\nمحتوى الملف:\n" + pdfText;
            if (isWebSearch) sysPrompt += "\nاستخدم البحث وقدم المصادر بوضوح.";

            const apiMessages = chatHistory.slice(-6).map(m => ({ role: m.role, content: m.content }));

            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": window.location.origin,
                    "X-Title": "Glow AI"
                },
                body: JSON.stringify({
                    model: "openrouter/free",
                    messages: [{ role: "system", content: sysPrompt }, ...apiMessages]
                })
            });

            const data = await response.json();
            if (typing.parentNode) chatBox.removeChild(typing);

            if (data.choices && data.choices[0]) {
                const rawRes = data.choices[0].message.content || "";
                const aiRes = sanitizeLanguage(rawRes) || "أهلاً بك، كيف يمكنني مساعدتك اليوم؟";
                if (!isAdmin) {
                    remainingAttempts = Math.max(0, remainingAttempts - 1);
                    localStorage.setItem(STORAGE_ATTEMPTS_KEY, remainingAttempts);
                }
                setStopState(true);
                addMessage(aiRes, "ai", true);
                chatHistory.push({ role: "assistant", content: aiRes, displayText: aiRes });
                saveCurrentChatToStorage();
            } else {
                addMessage("لم يصل رد من الخادم، حاول مرة أخرى.", "ai", false);
            }
        } catch (e) {
            if (typing.parentNode) chatBox.removeChild(typing);
            addMessage("عذراً، حدث خطأ في الاتصال.", "ai", false);
        }
    }

    function addMessage(text, side, anim, img = null) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg-wrapper ${side}-wrapper`;

        const displayText = typeof text === 'string'
            ? text
            : (Array.isArray(text) ? (text.find(t => t.type === 'text')?.text || "تحليل وسائط...") : String(text));

        if (side === 'ai') {
            div.innerHTML = `
                <div class="ai-avatar"><i class="fas fa-graduation-cap"></i></div>
                <div class="msg-col">
                    <div class="msg ai"></div>
                    <div class="msg-meta">
                        <button type="button" class="action-chip-btn" onclick="speakMessage(this)"><i class="fas fa-volume-high"></i> استماع للشرح</button>
                        <button type="button" class="action-chip-btn" onclick="copyText(this)"><i class="far fa-copy"></i> نسخ</button>
                    </div>
                </div>`;
            div.querySelector('.msg-col').dataset.rawText = displayText;
        } else {
            div.innerHTML = `<div class="msg user"></div>`;
        }

        const msgDiv = div.querySelector('.msg');
        if (img) {
            msgDiv.innerHTML += `<img src="data:image/jpeg;base64,${img}" style="max-width:210px; border-radius:10px; margin-bottom:8px; display:block;">`;
        }
        chatBox.appendChild(div);

        if (side === 'ai' && anim) {
            let i = 0;
            const step = 4;
            const streamTarget = document.createElement('div');
            msgDiv.appendChild(streamTarget);

            typingInterval = setInterval(() => {
                if (i < displayText.length) {
                    i = Math.min(displayText.length, i + step);
                    const partial = displayText.slice(0, i);
                    streamTarget.innerHTML = marked.parse(partial);
                    chatBox.scrollTop = chatBox.scrollHeight;
                } else {
                    stopCurrentTyping();
                    msgDiv.innerHTML = marked.parse(displayText);
                    processSources(msgDiv);
                }
            }, 14);
        } else {
            if (side === 'ai') {
                msgDiv.innerHTML = marked.parse(displayText);
                processSources(msgDiv);
            } else {
                const span = document.createElement('span');
                span.textContent = displayText;
                msgDiv.appendChild(span);
            }
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function processSources(container) {
        container.querySelectorAll('a').forEach(a => {
            try {
                const domain = new URL(a.href).hostname;
                a.target = "_blank";
                a.className = "source-chip";
                a.innerHTML = `<img src="https://www.google.com/s2/favicons?sz=64&domain=${domain}"> ${domain}`;
            } catch (e) {}
        });
    }

    function getSavedChats() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_CHATS_KEY) || '[]');
        } catch (e) {
            return [];
        }
    }

    function saveCurrentChatToStorage() {
        if (!chatHistory.length) return;
        const firstUser = chatHistory.find(m => m.role === 'user');
        let rawTitle = "دردشة جديدة";
        if (firstUser) {
            if (firstUser.displayText) rawTitle = firstUser.displayText;
            else if (typeof firstUser.content === 'string') rawTitle = firstUser.content;
            else if (Array.isArray(firstUser.content)) {
                rawTitle = firstUser.content.find(p => p.type === 'text')?.text || "تحليل صورة";
            }
        }
        const title = rawTitle.trim().substring(0, 28) || "دردشة";

        let chats = getSavedChats();
        const existingIndex = chats.findIndex(c => c.id === currentChatId);
        const chatObj = {
            id: currentChatId,
            title,
            updatedAt: Date.now(),
            history: chatHistory,
            pdf: pdfText
        };

        if (existingIndex > -1) chats[existingIndex] = chatObj;
        else chats.unshift(chatObj);

        localStorage.setItem(STORAGE_CHATS_KEY, JSON.stringify(chats));
        loadHistoryList();
    }

    function loadHistoryList() {
        const chats = getSavedChats();
        const list = document.getElementById('history-list');
        list.innerHTML = "";

        if (!chats.length) {
            list.innerHTML = `<div style="text-align:center; color:var(--text-dim); font-size:0.78rem; padding:18px 8px;">لا توجد دردشات محفوظة</div>`;
            return;
        }

        chats.forEach(chat => {
            const item = document.createElement('div');
            item.className = `history-item ${chat.id === currentChatId ? 'active-chat' : ''}`;
            item.innerHTML = `
                <i class="far fa-comment-dots" style="color:var(--gold-bright); flex-shrink:0;"></i>
                <span class="history-title-text">${escapeHtml(chat.title)}</span>
                <i class="fas fa-times del-single-chat" title="حذف الدردشة" onclick="deleteSingleChat(event, ${chat.id})"></i>
            `;
            item.onclick = () => {
                stopCurrentTyping();
                stopSpeech();
                currentChatId = chat.id;
                chatHistory = chat.history || [];
                pdfText = chat.pdf || "";
                document.getElementById('pdf-info').style.display = pdfText ? "block" : "none";
                if (pdfText) document.getElementById('pdf-info').innerText = "ملف PDF مرفق بهذه الدردشة ✅";

                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = "";
                chatHistory.forEach(m => {
                    const txt = m.displayText || m.content;
                    addMessage(txt, m.role === 'user' ? 'user' : 'ai', false, m.imgPreview || null);
                });
                loadHistoryList();
                toggleSidebar();
            };
            list.appendChild(item);
        });
    }

    function deleteSingleChat(e, id) {
        e.stopPropagation();
        let chats = getSavedChats().filter(c => c.id !== id);
        localStorage.setItem(STORAGE_CHATS_KEY, JSON.stringify(chats));
        if (currentChatId === id) startNewChat();
        else loadHistoryList();
    }

    function clearAllHistory() {
        localStorage.removeItem(STORAGE_CHATS_KEY);
        startNewChat();
        toggleSidebar();
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
    }
</script>
</body>
</html>
