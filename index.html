<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glow.ai | المساعد التعليمي الذكي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07090e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Glow-Ai">
    <link rel="apple-touch-icon" href="192.png">
    
    <!-- خط IBM Plex Sans Arabic العصري والأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-main: #07090e;
            --bg-panel: rgba(16, 22, 35, 0.85);
            --bg-card: rgba(24, 31, 48, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --accent-gold: #f59e0b;
            --gradient-brand: linear-gradient(135deg, #38bdf8 0%, #818cf8 55%, #c084fc 100%);
            --gradient-gold: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-glow: 0 0 22px rgba(56, 189, 248, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(129, 140, 248, 0.07) 0%, transparent 40%);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            font-size: 14px;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 10px; }

        /* الهيدر */
        header {
            padding: 12px 5%;
            background: rgba(7, 9, 14, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        
        .menu-toggle {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-toggle:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

        .logo {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-badge {
            font-size: 0.62rem;
            background: rgba(56, 189, 248, 0.14);
            color: var(--accent-primary);
            -webkit-text-fill-color: var(--accent-primary);
            padding: 2px 7px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
        }

        .plus-btn {
            background: var(--gradient-gold);
            color: #000;
            padding: 7px 15px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.78rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(245, 158, 11, 0.25);
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .plus-btn:hover { transform: translateY(-1px); }

        .admin-status {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-primary);
            font-weight: 700;
            cursor: pointer;
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 5px 13px;
            border-radius: 50px;
            font-size: 0.78rem;
            display: none;
        }

        /* القائمة الجانبية */
        #sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px); z-index: 90; display: none;
        }
        #sidebar-overlay.active { display: block; }

        #sidebar {
            position: fixed;
            right: -300px;
            top: 0;
            width: 275px;
            height: 100%;
            background: #0b0f19;
            border-left: 1px solid var(--border-glass);
            z-index: 100;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        #sidebar.open { right: 0; }

        .sidebar-header {
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 14px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h3 { font-size: 1rem; font-weight: 700; color: var(--text-main); }

        .sidebar-btn {
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 9px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .new-chat-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-primary);
        }
        .moe-btn {
            background: var(--gradient-brand);
            color: #050811;
            font-weight: 700;
            border: none;
        }

        .history-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 10px 0 6px;
            font-weight: 600;
        }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; }
        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.82rem;
            color: #cbd5e1;
            border: 1px solid transparent;
            transition: 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-item:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: rgba(56, 189, 248, 0.3);
            color: #fff;
        }

        /* منطقة المحادثة */
        #chat-box {
            flex: 1;
            padding: 18px 5%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .welcome-screen {
            margin: auto;
            text-align: center;
            max-width: 540px;
            padding: 16px;
            animation: fadeIn 0.4s ease;
        }
        .welcome-icon {
            width: 58px; height: 58px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: var(--gradient-brand);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem;
            color: #050811;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.28);
        }
        .welcome-screen h1 {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }
        .welcome-screen p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px; }

        .quick-prompts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }
        .prompt-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: 14px;
            text-align: right;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.82rem;
            color: #e2e8f0;
        }
        .prompt-card:hover {
            border-color: var(--accent-primary);
            background: rgba(56, 189, 248, 0.08);
        }
        .prompt-card i { color: var(--accent-primary); margin-bottom: 5px; display: block; font-size: 1rem; }

        /* فقاعات الرسائل بأحجام متناسقة غير مكبرة */
        .msg-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 88%;
            animation: slideUp 0.25s ease;
        }
        .ai-wrapper { align-self: flex-start; width: 100%; max-width: 780px; }
        .user-wrapper { align-self: flex-end; flex-direction: row-reverse; }

        /* أيقونة البوت داخل المربع */
        .ai-icon {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(129, 140, 248, 0.18));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.35);
            flex-shrink: 0;
            font-size: 0.95rem;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.12);
        }

        .msg-content-box { flex: 1; min-width: 0; }

        .msg {
            line-height: 1.65;
            font-size: 0.9rem;
            position: relative;
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
        }

        .msg.ai {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-top-right-radius: 4px;
            color: #f1f5f9;
        }

        .msg.user {
            background: var(--gradient-brand);
            color: #050811;
            font-weight: 600;
            border-top-left-radius: 4px;
            padding: 9px 15px;
            font-size: 0.9rem;
        }

        /* تنسيق النصوص الداخلية */
        .msg.ai p { margin-bottom: 8px; }
        .msg.ai p:last-child { margin-bottom: 0; }
        .msg.ai ul, .msg.ai ol { padding-right: 18px; margin-bottom: 8px; }
        .msg.ai li { margin-bottom: 4px; }
        .msg.ai strong { color: var(--accent-primary); font-weight: 700; }
        .msg.ai h1, .msg.ai h2, .msg.ai h3 { color: #fff; margin: 10px 0 6px; font-weight: 700; font-size: 1rem; }
        .msg.ai pre {
            background: #04060a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
            overflow-x: auto;
            margin: 10px 0;
            direction: ltr;
            text-align: left;
            font-family: monospace;
            font-size: 0.82rem;
            color: #38bdf8;
        }
        .msg.ai code {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-primary);
            padding: 1px 5px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.85em;
        }
        .msg.ai pre code { background: transparent; padding: 0; color: inherit; }

        /* حركة الثلاث نقاط المتناسقة */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 2px;
            height: 20px;
        }
        .typing-indicator span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-primary);
            display: inline-block;
            animation: bounceDots 1.3s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; background: #38bdf8; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; background: #818cf8; }
        .typing-indicator span:nth-child(3) { animation-delay: 0s; background: #c084fc; }

        @keyframes bounceDots {
            0%, 80%, 100% { transform: scale(0.55) translateY(0); opacity: 0.4; }
            40% { transform: scale(1.1) translateY(-5px); opacity: 1; }
        }

        .msg-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .copy-msg-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 3px 9px;
            border-radius: 7px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .copy-msg-btn:hover { color: var(--accent-primary); border-color: var(--accent-primary); }

        .source-card {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(56, 189, 248, 0.08);
            padding: 4px 10px; border-radius: 8px;
            margin-top: 6px; margin-left: 5px;
            text-decoration: none; color: var(--accent-primary);
            font-size: 0.76rem; border: 1px solid rgba(56, 189, 248, 0.25);
        }
        .source-card img { width: 14px; height: 14px; border-radius: 3px; }

        /* منطقة الإدخال السفلية */
        .input-area {
            padding: 10px 5% 18px;
            background: linear-gradient(to top, var(--bg-main) 78%, transparent);
            position: relative;
            z-index: 15;
        }

        .top-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .web-search-toggle {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 4px 12px; border-radius: 20px;
            cursor: pointer; transition: 0.2s;
            font-size: 0.75rem; color: var(--text-muted); font-weight: 500;
        }
        .web-search-toggle.active {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            background: rgba(56, 189, 248, 0.12);
        }

        #counter {
            font-size: 0.75rem;
            color: var(--accent-gold);
            font-weight: 600;
            background: rgba(245, 158, 11, 0.1);
            padding: 4px 11px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .input-container {
            background: rgba(20, 26, 40, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            display: flex;
            align-items: flex-end;
            padding: 8px 12px;
            max-width: 820px;
            margin: 0 auto;
            gap: 6px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), var(--shadow-glow);
        }
        .input-container:focus-within {
            border-color: rgba(56, 189, 248, 0.45);
        }

        .input-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 6px 4px;
            outline: none;
            font-size: 0.9rem;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            line-height: 1.45;
        }
        .input-container textarea::placeholder { color: #64748b; font-size: 0.86rem; }

        .action-icon {
            width: 34px; height: 34px;
            border-radius: 50%;
            color: var(--text-muted);
            font-size: 1.05rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .action-icon:hover { background: rgba(255, 255, 255, 0.08); color: var(--accent-primary); }

        .send-btn-small {
            background: var(--gradient-brand);
            color: #050811;
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
            font-size: 0.92rem;
        }
        .send-btn-small:hover { transform: scale(1.05); }
        .send-btn-small.stop-active {
            background: #ef4444 !important;
            color: #fff !important;
        }

        /* النوافذ المنبثقة */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 5, 10, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #0f1523;
            padding: 28px 22px;
            border-radius: 24px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            .quick-prompts { grid-template-columns: 1fr; }
            .msg-wrapper { max-width: 94%; }
            #chat-box { padding: 14px 4%; }
        }
    </style>
</head>
<body>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
    <div class="sidebar-header">
        <h3><i class="fas fa-graduation-cap" style="color:var(--accent-primary); margin-left:6px;"></i> سجل Glow</h3>
        <div class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-times"></i></div>
    </div>
    <div class="sidebar-btn new-chat-btn" onclick="startNewChat(); toggleSidebar();"><i class="fas fa-plus"></i> محادثة جديدة</div>
    <a href="https://www.moe.edu.ps/gaza/subjects" target="_blank" class="sidebar-btn moe-btn"><i class="fas fa-book-open"></i> تحميل الرزم التعليمية</a>
    <div class="history-title">المحادثات السابقة</div>
    <div class="history-list" id="history-list"></div>
</div>

<header>
    <div class="logo-area">
        <div class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        <div class="logo" onclick="location.reload()">Glow.ai <span class="logo-badge">PRO 2.0</span></div>
    </div>
    <div id="header-actions">
        <button id="plus-btn" class="plus-btn" onclick="showPlusModal()"><i class="fas fa-crown"></i> GLOW PLUS</button>
        <div id="admin-tag" class="admin-status" onclick="logoutAdmin()"><i class="fas fa-shield-halved"></i> ADMIN ● خروج</div>
    </div>
</header>

<div id="chat-box"></div>

<div class="input-area">
    <div class="top-controls">
        <div class="web-search-toggle" id="webSearchBtn" onclick="toggleWebSearch()">
            <i class="fas fa-globe"></i>
            <span>بحث الويب الذكي</span>
        </div>
        <div id="counter"></div>
    </div>

    <div id="preview-container" style="display:none; text-align:center; margin-bottom:8px;">
        <div style="display:inline-block; position:relative;">
            <img id="preview-img" src="" style="height:60px; border-radius:12px; border:2px solid var(--accent-primary);">
            <i class="fas fa-times-circle" onclick="cancelImage()" style="position:absolute; top:-7px; right:-7px; color:#ef4444; background:#fff; border-radius:50%; cursor:pointer; font-size:1rem;"></i>
        </div>
    </div>
    
    <div id="pdf-info" style="text-align:center; color:var(--accent-primary); font-size:0.78rem; font-weight:600; display:none; margin-bottom:6px;"></div>
    
    <div class="input-container">
        <label for="file-input" class="action-icon" title="رفع ملف PDF"><i class="fas fa-file-pdf"></i></label>
        <input type="file" id="file-input" accept="application/pdf" style="display:none" onchange="processPDF(this)">
        
        <label for="image-input" class="action-icon" title="تحليل صورة"><i class="fas fa-image"></i></label>
        <input type="file" id="image-input" accept="image/*" style="display:none" onchange="previewImage(this)">
        
        <textarea id="userInput" rows="1" placeholder="اكتب سؤالك هنا أو ارفع ملفاً..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
        
        <button id="sendBtn" class="send-btn-small" onclick="askAI()">
            <i id="sendIcon" class="fas fa-arrow-up"></i>
        </button>
    </div>
</div>

<!-- نافذة انتهاء المحاولات -->
<div id="plusModal" class="modal">
    <div class="modal-content">
        <div style="font-size:2.2rem; margin-bottom:8px;"><span id="rocket-trigger" style="cursor:pointer;">🚀</span></div>
        <h2 style="color:var(--accent-gold); margin-bottom:6px; font-weight:700; font-size:1.25rem;">انتهت محاولاتك المجانية!</h2>
        <p style="color:var(--text-muted); font-size:0.86rem; line-height:1.5;">اشترك في باقة Glow Plus للحصول على وصول غير محدود وسرعة فائقة في تحليل الرزم.</p>
        <button onclick="closeModal('plusModal')" style="margin-top:18px; background:rgba(255,255,255,0.06); border:1px solid var(--border-glass); color:#cbd5e1; padding:8px 22px; border-radius:10px; cursor:pointer; font-weight:600; font-size:0.85rem;">إغلاق</button>
    </div>
</div>

<!-- لوحة المطور -->
<div id="adminPanel" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--accent-primary); font-weight:700; font-size:1.1rem;"><i class="fas fa-terminal"></i> تفعيل صلاحيات المطور</h3>
        <input type="password" id="adminPass" style="background:#07090e; border:1px solid var(--accent-primary); color:#fff; padding:12px; width:100%; text-align:center; border-radius:12px; margin:15px 0; font-size:0.95rem;" placeholder="أدخل كود المطور">
        <button class="moe-btn" style="width:100%; padding:10px; border-radius:12px; font-size:0.9rem;" onclick="verifyAdmin()">تفعيل الآن</button>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const p1 = "sk-or-v1-";
    const p2 = "a38edadebdd2115f8aeaaa5e0b2bf0ca";
    const p3 = "a42887de22e33536ada71561950623d9";
    const API_KEY = p1 + p2 + p3;

    let pdfText = "", chatHistory = [], selectedImageBase64 = null, rClicks = 0;
    let currentChatId = Date.now(), isWebSearch = false;
    let typingInterval = null, isTyping = false;

    const deviceId = btoa(navigator.userAgent).substring(0, 15);
    let isAdmin = sessionStorage.getItem('Glow_admin_mode') === 'true';
    let attempts = localStorage.getItem('Glow_usage_' + deviceId);
    if (attempts === null) { attempts = 10; localStorage.setItem('Glow_usage_' + deviceId, 10); }

    window.onload = () => {
        loadHistory();
        startNewChat();
        if(isAdmin) {
            document.getElementById('plus-btn').style.display = "none";
            document.getElementById('admin-tag').style.display = "block";
        }
        syncUI();
    };

    function handleEnter(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            askAI();
        }
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    function toggleWebSearch() {
        isWebSearch = !isWebSearch;
        document.getElementById('webSearchBtn').classList.toggle('active');
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function startNewChat() {
        currentChatId = Date.now();
        chatHistory = [];
        pdfText = "";
        document.getElementById('pdf-info').style.display = "none";
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = `
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-icon"><i class="fas fa-graduation-cap"></i></div>
                <h1>${isAdmin ? "أهلاً م. أحمد.. وضع المطور نشط" : "مرحباً بك في Glow.ai"}</h1>
                <p>مساعدك التعليمي الذكي لفهم الدروس، تلخيص الرزم، وحل المسائل بدقة.</p>
                <div class="quick-prompts">
                    <div class="prompt-card" onclick="quickAsk('لخّص لي أهم النقاط في الملف المرفق بشكل مرتب')">
                        <i class="fas fa-file-lines"></i>
                        تلخيص رزمة أو ملف PDF
                    </div>
                    <div class="prompt-card" onclick="quickAsk('اشرح لي قاعدة في اللغة الإنجليزية مع أمثلة')">
                        <i class="fas fa-language"></i>
                        شرح قواعد وأمثلة مبسطة
                    </div>
                    <div class="prompt-card" onclick="quickAsk('اعمل لي اختبار قصير من 5 أسئلة لاختبار فهمي')">
                        <i class="fas fa-list-check"></i>
                        إنشاء اختبار تدريبي سريع
                    </div>
                    <div class="prompt-card" onclick="quickAsk('ساعدني في تنظيم جدول دراسي يومي فعّال')">
                        <i class="fas fa-calendar-check"></i>
                        تنظيم جدول المذاكرة
                    </div>
                </div>
            </div>
        `;
    }

    function quickAsk(text) {
        document.getElementById('userInput').value = text;
        askAI();
    }

    function previewImage(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedImageBase64 = e.target.result.split(',')[1];
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('preview-container').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function cancelImage() {
        selectedImageBase64 = null;
        document.getElementById('preview-container').style.display = 'none';
    }

    async function processPDF(input) {
        const file = input.files[0]; if (!file) return;
        const info = document.getElementById('pdf-info');
        info.style.display = "block";
        info.innerText = "جاري تحليل الصفحات... ⏳";
        const reader = new FileReader();
        reader.onload = async function() {
            try {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += `[صفحة ${i}]: ` + content.items.map(s => s.str).join(" ") + "\n";
                    info.innerText = `جاري القراءة: ${i} / ${pdf.numPages}`;
                }
                pdfText = fullText;
                info.innerText = `تم تجهيز الملف (${pdf.numPages} صفحة) بنجاح ✅`;
            } catch (err) {
                info.innerText = "تعذر قراءة الملف ❌";
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function setStopState(active) {
        isTyping = active;
        const btn = document.getElementById('sendBtn');
        const icon = document.getElementById('sendIcon');
        if (active) {
            btn.classList.add('stop-active');
            icon.className = 'fas fa-stop';
        } else {
            btn.classList.remove('stop-active');
            icon.className = 'fas fa-arrow-up';
        }
    }

    function stopCurrentTyping() {
        if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
        setStopState(false);
    }

    async function askAI() {
        if (isTyping) { stopCurrentTyping(); return; }
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text && !selectedImageBase64) return;
        if(!isAdmin && attempts <= 0) { showPlusModal(); return; }

        const welcome = document.getElementById('welcomeScreen');
        if (welcome) welcome.remove();

        addMessage(text || "تحليل الصورة المرفقة...", "user", false, selectedImageBase64);
        
        let currentContent = selectedImageBase64 ? [
            { type: "text", text: text || "اشرح ما في هذه الصورة بالتفصيل." },
            { type: "image_url", image_url: { url: `data:image/jpeg;base64,${selectedImageBase64}` } }
        ] : text;

        chatHistory.push({ role: "user", content: currentContent });
        cancelImage(); 
        input.value = "";
        input.style.height = 'auto';

        const chatBox = document.getElementById('chat-box');
        const typing = document.createElement('div');
        typing.className = 'msg-wrapper ai-wrapper';
        typing.innerHTML = `
            <div class="ai-icon"><i class="fas fa-graduation-cap"></i></div>
            <div class="msg-content-box">
                <div class="msg ai">
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>
            </div>`;
        chatBox.appendChild(typing);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            let sysPrompt = "أنت Glow التعليمي، مساعد ذكي فائق الدقة للطلاب. تطوير م. أحمد الأسطل. نسّق إجاباتك بشكل واضح ومنظم باستخدام العناوين والنقاط. لا تذكر جوجل نهائياً.";
            if (pdfText) sysPrompt += "\nمحتوى الملف المرفق:\n" + pdfText;
            if (isWebSearch) sysPrompt += "\nاستخدم البحث وقدم المصادر والروابط بوضوح.";

            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${API_KEY}`, 
                    "Content-Type": "application/json",
                    "HTTP-Referer": window.location.origin,
                    "X-Title": "Glow AI"
                },
                body: JSON.stringify({ 
                    model: "openrouter/free", 
                    messages: [{ role: "system", content: sysPrompt }, ...chatHistory.slice(-6)] 
                })
            });

            const data = await response.json();
            if (typing.parentNode) chatBox.removeChild(typing);
            
            if (data.choices && data.choices[0]) {
                const aiRes = data.choices[0].message.content;
                setStopState(true);
                addMessage(aiRes, "ai", true);
                chatHistory.push({ role: "assistant", content: aiRes });
                if(!isAdmin) {
                    attempts--;
                    localStorage.setItem('Glow_usage_' + deviceId, attempts);
                    syncUI();
                }
                saveChat();
            } else {
                addMessage("لم يصل رد من الخادم، حاول مجدداً.", "ai", false);
            }
        } catch (e) { 
            if (typing.parentNode) chatBox.removeChild(typing);
            addMessage("عذراً، تعذر الاتصال بالخادم حالياً.", "ai", false); 
        }
    }

    function addMessage(text, side, anim, img = null) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg-wrapper ${side}-wrapper`;
        
        if (side === 'ai') {
            div.innerHTML = `
                <div class="ai-icon"><i class="fas fa-graduation-cap"></i></div>
                <div class="msg-content-box">
                    <div class="msg ai"></div>
                    <div class="msg-actions">
                        <button class="copy-msg-btn" onclick="copyText(this)"><i class="far fa-copy"></i> نسخ الإجابة</button>
                    </div>
                </div>`;
        } else {
            div.innerHTML = `<div class="msg user"></div>`;
        }

        const msgDiv = div.querySelector('.msg');
        if(img) msgDiv.innerHTML += `<img src="data:image/jpeg;base64,${img}" style="max-width:220px; border-radius:10px; margin-bottom:8px; display:block;">`;
        chatBox.appendChild(div);
        
        const displayText = Array.isArray(text) ? text.find(t => t.type === 'text')?.text || "تحليل وسائط..." : text;

        if(side === 'ai' && anim) {
            let i = 0; 
            typingInterval = setInterval(() => {
                if(i < displayText.length) {
                    msgDiv.innerText += displayText[i];
                    i++;
                    chatBox.scrollTop = chatBox.scrollHeight;
                } else {
                    stopCurrentTyping();
                    msgDiv.innerHTML = marked.parse(displayText);
                    processSources(msgDiv);
                }
            }, 8);
        } else {
            if (side === 'ai') {
                msgDiv.innerHTML = marked.parse(displayText);
                processSources(msgDiv);
            } else {
                msgDiv.appendChild(document.createTextNode(displayText));
            }
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function copyText(btn) {
        const text = btn.closest('.msg-content-box').querySelector('.msg.ai').innerText;
        navigator.clipboard.writeText(text);
        btn.innerHTML = '<i class="fas fa-check" style="color:var(--accent-primary);"></i> تم النسخ';
        setTimeout(() => {
            btn.innerHTML = '<i class="far fa-copy"></i> نسخ الإجابة';
        }, 2000);
    }

    function processSources(container) {
        const links = container.querySelectorAll('a');
        links.forEach(a => {
            try {
                const domain = new URL(a.href).hostname;
                a.target = "_blank";
                a.className = "source-card";
                a.innerHTML = `<img src="https://www.google.com/s2/favicons?sz=64&domain=${domain}"> ${domain}`;
            } catch(e) {}
        });
    }

    function syncUI() {
        document.getElementById('counter').innerHTML = isAdmin 
            ? `<i class="fas fa-infinity"></i> وضع المطور غير محدود` 
            : `<i class="fas fa-bolt"></i> المتبقي: ${attempts}`;
    }

    function showPlusModal() { document.getElementById('plusModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function saveChat() {
        let chats = JSON.parse(localStorage.getItem('glow_chats') || '{}');
        let firstContent = chatHistory[0].content;
        let title = Array.isArray(firstContent) ? firstContent[0].text : firstContent;
        chats[currentChatId] = { title: title.substring(0, 26), history: chatHistory, pdf: pdfText };
        localStorage.setItem('glow_chats', JSON.stringify(chats));
        loadHistory();
    }

    function loadHistory() {
        let chats = JSON.parse(localStorage.getItem('glow_chats') || '{}');
        const list = document.getElementById('history-list');
        list.innerHTML = "";
        Object.keys(chats).reverse().forEach(id => {
            let item = document.createElement('div');
            item.className = "history-item";
            item.innerHTML = `<i class="far fa-message" style="color:var(--accent-primary);"></i> ${chats[id].title}`;
            item.onclick = () => {
                chatHistory = chats[id].history;
                pdfText = chats[id].pdf || "";
                document.getElementById('chat-box').innerHTML = "";
                chatHistory.forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'ai', false));
                toggleSidebar();
            };
            list.appendChild(item);
        });
    }

    function verifyAdmin() {
        if(document.getElementById('adminPass').value === "19791983") {
            sessionStorage.setItem('Glow_admin_mode', 'true');
            location.reload();
        } else {
            alert("كود المطور غير صحيح!");
        }
    }
    function logoutAdmin() { sessionStorage.removeItem('Glow_admin_mode'); location.reload(); }
    document.getElementById('rocket-trigger').onclick = () => {
        rClicks++;
        if(rClicks >= 3) {
            closeModal('plusModal');
            document.getElementById('adminPanel').style.display = 'flex';
        }
    };
</script>
</body>
</html>
